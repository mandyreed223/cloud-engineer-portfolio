name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::507880288914:role/GitHubActions-Portfolio-Deploy
          aws-region: us-east-1

      - name: Deploy website to S3
        run: |
          aws s3 cp index.html s3://mandy-cloud-portfolio-site/index.html
          aws s3 cp style.css s3://mandy-cloud-portfolio-site/style.css
          aws s3 sync images/ s3://mandy-cloud-portfolio-site/images/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E34ACDTAJCQX56 \
            --paths "/*"